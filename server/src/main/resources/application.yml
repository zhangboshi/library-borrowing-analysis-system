spring:
  application:
    name: library-borrowing-analysis
  datasource:
    url: jdbc:mysql://localhost:3306/library_borrowing?useSSL=false&characterEncoding=UTF-8&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: info
    com.example.library: debug

app:
  jwt:
    secret: "library-analysis-demo-secret" # 请根据生产环境修改
    expire-hours: 12
